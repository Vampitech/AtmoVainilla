name: Build Clean Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the release (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      release_name:
        description: 'Release display name'
        required: true
        default: 'AtmoVainilla 1.0.0'
      zip_root:
        description: 'Carpeta raiz dentro del ZIP (ej: UPD). Dejar vacio si no aplica'
        required: false
        default: 'UPD'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download AIO ZIP
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CF_CI_TOKEN }}
          ZIP_URL: "https://vampitech.net/switch/updater/NeXT.zip"
        run: |
          if [ -z "$CI_TOKEN" ]; then
            echo "ERROR: falta el secret CF_CI_TOKEN (Settings > Secrets and variables > Actions)"
            exit 1
          fi

          # -f: falla en 4xx/5xx en vez de guardar la pagina de error como ZIP
          # -D: guarda headers para diagnostico (no se usa -v para no exponer cabeceras de la peticion)
          if ! curl -L -f -sS --retry 3 --retry-delay 5 --retry-all-errors \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -H "X-CI-Token: $CI_TOKEN" \
              -D headers.txt -o NeXT.zip "$ZIP_URL"; then
            echo "ERROR: la descarga fallo. Headers de respuesta:"
            cat headers.txt 2>/dev/null || true
            if grep -qi "cf-mitigated" headers.txt 2>/dev/null; then
              echo ">>> Cloudflare esta aplicando un challenge. Revisa la regla WAF de bypass y el valor de CF_CI_TOKEN."
            fi
            exit 1
          fi

          echo "--- Headers de respuesta ---"
          cat headers.txt
          ls -lh NeXT.zip
          file NeXT.zip

          # Validar que sea realmente un ZIP y no una pagina de challenge
          if ! file NeXT.zip | grep -qi "zip archive"; then
            echo "ERROR: el archivo descargado no es un ZIP. Primeros bytes:"
            head -c 300 NeXT.zip
            echo
            exit 1
          fi

          # Validar tamano minimo (1 MB) para detectar descargas truncadas
          SIZE=$(stat -c%s NeXT.zip)
          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: NeXT.zip pesa solo $SIZE bytes, demasiado pequeno"
            exit 1
          fi

          # Validar integridad
          unzip -tq NeXT.zip

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o NeXT.zip -d extracted/

      - name: Show extracted structure
        run: find extracted/ -type f | sort

      - name: Select and copy files
        shell: bash
        env:
          ZIP_ROOT: ${{ inputs.zip_root }}
        run: |
          mkdir -p output
          while IFS= read -r line || [ -n "$line" ]; do
            [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue
            SRC="extracted/$line"
            if [[ -n "$ZIP_ROOT" && "$line" == "$ZIP_ROOT/"* ]]; then
              STRIPPED="${line#${ZIP_ROOT}/}"
            else
              STRIPPED="$line"
            fi
            DEST="output/$STRIPPED"
            if [ -e "$SRC" ]; then
              mkdir -p "$(dirname "$DEST")"
              if [ -d "$SRC" ]; then
                mkdir -p "$DEST"
                cp -a "$SRC"/. "$DEST"/
              else
                cp -a "$SRC" "$DEST"
              fi
              echo "Copied: $line -> $STRIPPED"
            else
              echo "WARNING: Not found: $SRC"
            fi
          done < package_files.txt

      - name: Apply file operations
        shell: bash
        run: |
          if [ ! -f package_moves.txt ]; then
            echo "No package_moves.txt found, skipping file operations."
            exit 0
          fi
          while IFS='|' read -r action src dst || [ -n "$action" ]; do
            [[ "$action" =~ ^#.*$ || -z "$action" ]] && continue
            SRC="output/$src"
            DST="output/$dst"
            if [ ! -e "$SRC" ]; then
              echo "WARNING: Source not found: $SRC"
              continue
            fi
            mkdir -p "$(dirname "$DST")"
            case "$action" in
              copy)
                if [ -d "$SRC" ]; then
                  mkdir -p "$DST"
                  cp -a "$SRC"/. "$DST"/
                else
                  cp -a "$SRC" "$DST"
                fi
                echo "Copied: $src -> $dst"
                ;;
              move)
                mv "$SRC" "$DST"
                echo "Moved: $src -> $dst"
                ;;
              rename)
                PARENT="$(dirname "$SRC")"
                mv "$SRC" "$PARENT/$dst"
                echo "Renamed: $src -> $PARENT/$dst"
                ;;
              *)
                echo "WARNING: Unknown action: $action"
                ;;
            esac
          done < package_moves.txt

      - name: Fix output permissions
        shell: bash
        run: |
          chmod -R u+rwX output/

      - name: Apply exclusions
        shell: bash
        run: |
          if [ ! -f package_exclude.txt ]; then
            echo "No package_exclude.txt found, skipping exclusions."
            exit 0
          fi
          while IFS= read -r line || [ -n "$line" ]; do
            [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue
            TARGET="output/$line"
            if [ -e "$TARGET" ]; then
              chmod -R u+rwX "$TARGET"
              rm -rf "$TARGET"
              echo "Excluded: $line"
            else
              echo "WARNING: Exclude target not found: $TARGET"
            fi
          done < package_exclude.txt

      - name: Patch exosphere.ini
        shell: bash
        run: |
          if [ ! -f exosphere.ini ]; then
            echo "No exosphere.ini found in repo, skipping."
            exit 0
          fi
          cp exosphere.ini output/exosphere.ini
          echo "exosphere.ini replaced."
          echo "--- Final exosphere.ini ---"
          cat output/exosphere.ini

      - name: Patch hekate_ipl.ini
        shell: bash
        run: |
          mkdir -p output/bootloader
          if [ ! -f hekate_entries.ini ]; then
            echo "No hekate_entries.ini found, skipping hekate patch."
            exit 0
          fi
          cp hekate_entries.ini output/bootloader/hekate_ipl.ini
          echo "hekate_ipl.ini replaced."
          echo "--- Final hekate_ipl.ini ---"
          cat output/bootloader/hekate_ipl.ini

      - name: Show final output structure
        shell: bash
        run: |
          echo "--- Final output files ---"
          find output/ -type f | sort

      - name: Create output ZIP
        shell: bash
        run: |
          cd output
          zip -r ../AtmoVainilla.zip .
          cd ..
          du -sh AtmoVainilla.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.release_name }}
          body_path: RELEASE_NOTES.md
          files: AtmoVainilla.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
